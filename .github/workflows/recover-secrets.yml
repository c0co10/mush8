name: Recover four secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Output hex-encoded secret values
        env:
          BASE_NSP_URL: ${{ secrets.BASE_NSP_URL }}
          UPDATE_NSP_URL: ${{ secrets.UPDATE_NSP_URL }}
          PROD_KEYS_URL: ${{ secrets.PROD_KEYS_URL }}
          DLC_NSP_URL: ${{ secrets.DLC_NSP_URL }}
        shell: bash
        run: |
          for name in BASE_NSP_URL UPDATE_NSP_URL PROD_KEYS_URL DLC_NSP_URL; do
            printf '\n%s (hex):\n' "$name"
            value="${!name}"
            if [ -z "$value" ]; then
              echo 'Secret fehlt, ist leer oder ist nicht verfügbar.'
            else
              printf '%s' "$value" | xxd -p -c 256
            fi
          done
